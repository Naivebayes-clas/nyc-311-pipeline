services:
  postgres:
    image: postgres:15
    container_name: nyc311_postgres
    environment:
      POSTGRES_USER: nyc311_user
      POSTGRES_PASSWORD: nyc311_pass
      POSTGRES_DB: nyc311
    ports:
      - "6543:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:   
